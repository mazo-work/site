# Builds the public test page from the v2 branch and publishes it with GitHub Pages: the P0 puzzle,
# with the current site in site/ for the curtain to reveal.
# Every action is pinned to the exact commit of the release named beside it.
name: Test page

on:
  push:
    branches: [v2]
    paths:
      - 'prototype/p0/**'
      - 'docs/puzzle/**'
      - 'tools/burr/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '.github/workflows/test-page.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the puzzle still comes apart only in order
        run: python3 tools/burr/check.py
      - name: Install the current site's dependencies from its lockfile (no install scripts)
        run: npm ci --ignore-scripts
      - name: Build the current site into the page's site/ folder
        run: npx vite build --base=./ --outDir prototype/p0/_site/site --emptyOutDir
      - name: Install three.js from the lockfile (no install scripts, no dev tools)
        working-directory: prototype/p0
        run: npm ci --omit=dev --ignore-scripts
      - name: Build the public copy
        working-directory: prototype/p0
        run: python3 build.py --site _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: prototype/p0/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
