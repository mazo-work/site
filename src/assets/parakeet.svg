<!-- The parakeet: a placeholder sprite (v4 BRIEF.md §3), the 12 × 12 pixel map from docs/v4-mocks/Parakeet.dc.html.
     Jon's artist replaces this file and nothing else. The contract: viewBox 0 0 12 12 (any square grid works if the
     viewBox says so); the bird faces right, standing, its feet on the bottom row; the head is one group with
     class="bird-head", which turns around the neck at (6, 5) to follow the pointer; everything else is the body.
     Colours as presentation attributes (fill="…") only: no style attributes, no <style>, no scripts, no links to other
     files (the site's CSP refuses them, and the bird makes no network request). -->
