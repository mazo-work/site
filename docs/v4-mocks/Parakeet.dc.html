<!doctype html>
<html lang="en">
<head>

<title>The parakeet: five states</title>

<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.appear{animation:appear 3.2s steps(8,end) infinite}
@keyframes appear{0%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1)}}
.spark{position:absolute;color:#5B8DEF;font-size:16px;animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:1}}
.pace{animation:pace 6s ease-in-out infinite;transform-origin:24px 40px}
.hop{animation:hop 1.4s ease-in-out infinite}
@keyframes pace{0%,42%{transform:translateX(0) scaleX(1)}50%,92%{transform:translateX(-30px) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
@keyframes hop{0%,55%,100%{transform:translateY(0)}65%{transform:translateY(-7px)}75%{transform:translateY(0)}82%{transform:translateY(-3px)}88%{transform:translateY(0)}}
.fly{position:absolute;left:0;top:0;offset-path:path('M20,150 C70,20 180,20 230,120');offset-rotate:0deg;animation:fly 2.8s ease-in-out infinite}
@keyframes fly{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
.wing-up{animation:flapA .3s steps(1,end) infinite}
.wing-down{animation:flapB .3s steps(1,end) infinite}
@keyframes flapA{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes flapB{0%,49%{opacity:0}50%,100%{opacity:1}}
.land{animation:land 4s ease-in-out infinite}
@keyframes land{0%{transform:translate(-90px,-120px);opacity:1}45%{transform:translate(0,0);opacity:1}70%{transform:translate(0,0);opacity:1}85%,100%{transform:translate(0,0);opacity:0}}
.photo{animation:photo 4s ease-in-out infinite}
@keyframes photo{0%,60%{opacity:.25}85%,100%{opacity:1}}
.head{transform-box:view-box;transform-origin:6px 5px;animation:look 4s ease-in-out infinite}
@keyframes look{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(14deg)}}
.pointer{animation:point 4s ease-in-out infinite}
@keyframes point{0%,100%{transform:translate(-70px,-40px)}50%{transform:translate(70px,-50px)}}
.mark-light{animation:blink 2.6s steps(1,end) infinite}
@keyframes blink{0%,62%{opacity:1}63%,88%{opacity:.12}89%,100%{opacity:1}}
</style>
</helmet>
<div style="width: 1440px; height: 620px; box-sizing: border-box; padding: 40px 48px; background: #F3F1EC; color: #1F1B16; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif">
  <p style="margin: 0 0 24px; font-size: 16px; color: #4A453E; max-width: 1100px">A placeholder sprite. Your artist's parakeet replaces it with no change to the code; what this sheet shows is how it moves.</p>

    <figure style="margin: 0; background: #FFFFFF; border: 1px solid #D9D4CA; height: 420px; display: flex; flex-direction: column">

            <div class="hop" style="width: 48px; height: 48px">
